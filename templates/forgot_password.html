{% extends "base.html" %}
{% block title %}Forgot Password – MU Portal{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
  <div style="width:100%;max-width:420px">
    <div class="card" style="padding:36px 40px">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:2.8rem;margin-bottom:10px"></div>
        <h1 style="margin:0;font-size:1.5rem;font-weight:700;color:var(--text)">Forgot Password?</h1>
        <p style="margin:8px 0 0;color:var(--text2);font-size:0.9rem">Enter your email and we'll send you a reset link.</p>
      </div>

      <form method="POST">
        <div style="margin-bottom:20px">
          <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text2);margin-bottom:6px">Email Address</label>
          <input type="email" name="email" required placeholder="your@email.com"
                 style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;
                        font-size:0.92rem;color:var(--text);background:var(--surface);box-sizing:border-box;
                        outline:none;transition:border .2s"
                 onfocus="this.style.borderColor='var(--teal)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:0.95rem">
           Send Reset Link
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text3)">
        Remembered it?
        <a href="{{ url_for('login') }}" style="color:var(--teal);font-weight:600;text-decoration:none">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
