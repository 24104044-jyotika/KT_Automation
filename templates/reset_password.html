{% extends "base.html" %}
{% block title %}Reset Password – MU Portal{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
  <div style="width:100%;max-width:420px">
    <div class="card" style="padding:36px 40px">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:2.8rem;margin-bottom:10px"></div>
        <h1 style="margin:0;font-size:1.5rem;font-weight:700;color:var(--text)">Create New Password</h1>
        <p style="margin:8px 0 0;color:var(--text2);font-size:0.9rem">Choose a strong password for your account.</p>
      </div>

      <form method="POST">
        <div style="margin-bottom:18px">
          <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text2);margin-bottom:6px">New Password</label>
          <input type="password" name="password" required placeholder="At least 6 characters" minlength="6"
                 style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;
                        font-size:0.92rem;color:var(--text);background:var(--surface);box-sizing:border-box"
                 onfocus="this.style.borderColor='var(--teal)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <div style="margin-bottom:24px">
          <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text2);margin-bottom:6px">Confirm Password</label>
          <input type="password" name="confirm_password" required placeholder="Same password again"
                 style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;
                        font-size:0.92rem;color:var(--text);background:var(--surface);box-sizing:border-box"
                 onfocus="this.style.borderColor='var(--teal)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;font-size:0.95rem">
           Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
